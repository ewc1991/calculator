<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Calculator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f0f;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    .calculator {
      background: #1a1a1a;
      border-radius: 24px;
      padding: 24px;
      height: 90vh;
      height: 90dvh;
      aspect-ratio: 340 / 568;
      box-shadow: 0 32px 64px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255,255,255,0.05);
      display: flex;
      flex-direction: column;
    }

    /* Display */
    .display {
      flex-shrink: 0;
      background: #111;
      border-radius: 16px;
      padding: 20px 24px 16px;
      margin-bottom: 20px;
      min-height: 96px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      overflow: hidden;
    }

    .expression {
      font-size: 14px;
      color: #555;
      min-height: 20px;
      word-break: break-all;
      text-align: right;
      transition: color 0.15s;
    }

    .result {
      font-size: 40px;
      font-weight: 300;
      color: #f0f0f0;
      word-break: break-all;
      text-align: right;
      letter-spacing: -1px;
      transition: font-size 0.1s;
    }

    .result.small { font-size: 28px; }
    .result.xsmall { font-size: 20px; }

    /* Button grid */
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 12px;
      flex: 1;
    }

    button {
      height: 100%;
      border: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 400;
      cursor: pointer;
      transition: transform 0.08s, filter 0.08s, background 0.1s;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      transform: scale(0.93);
      filter: brightness(0.85);
    }

    /* Button variants */
    .btn-func {
      background: #2e2e2e;
      color: #a0a0a0;
      font-size: 15px;
    }

    .btn-op {
      background: #ff9500;
      color: #fff;
      font-weight: 500;
    }

    .btn-op.active {
      background: #fff;
      color: #ff9500;
    }

    .btn-num {
      background: #2a2a2a;
      color: #f0f0f0;
    }

    .btn-zero {
      grid-column: span 2;
      border-radius: 14px;
      text-align: left;
      padding-left: 24px;
    }

    .btn-eq {
      background: #ff9500;
      color: #fff;
      font-weight: 500;
      font-size: 22px;
    }

    button:hover { filter: brightness(1.12); }
    button:active { filter: brightness(0.85); }

    /* Mobile: full screen in any orientation */
    @media (max-width: 768px), (orientation: landscape) and (max-height: 500px) {
      .calculator {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        aspect-ratio: unset;
        border-radius: 0;
      }
    }

    /* Robot sprite */
    .robot-sprite {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      transform-origin: bottom center;
      animation: robot-click 0.68s cubic-bezier(0.22,1,0.36,1) forwards;
      filter: drop-shadow(0 2px 10px rgba(0,212,255,0.45));
    }

    @keyframes robot-click {
      0%   { opacity:0; transform: translateY(-30px) scale(0.1) rotate(-20deg); }
      22%  { opacity:1; transform: translateY(6px) scale(1.15) rotate(4deg); }
      38%  { transform: translateY(0) scale(1) rotate(0deg); }
      56%  { transform: translateY(18px) scale(0.92, 1.08); }
      71%  { transform: translateY(-6px) scale(1.07, 0.94); }
      83%  { transform: translateY(0) scale(1); }
      100% { opacity:0; transform: translateY(-24px) scale(0.3) rotate(14deg); }
    }

    button.kb-active {
      transform: scale(0.93) !important;
      filter: brightness(0.85) !important;
    }

    /* Mobile landscape: compact display so buttons get more room */
    @media (orientation: landscape) and (max-height: 500px) {
      .calculator { padding: 10px; }
      .display {
        min-height: 52px;
        padding: 8px 14px;
        margin-bottom: 10px;
      }
      .result { font-size: 26px; }
      .result.small { font-size: 20px; }
      .result.xsmall { font-size: 16px; }
      .expression { font-size: 11px; min-height: 14px; }
      .buttons { gap: 8px; }
    }
  </style>
</head>
<body>
<div class="calculator">
  <div class="display">
    <div class="expression" id="expression"></div>
    <div class="result" id="result">0</div>
  </div>
  <div class="buttons">
    <!-- Row 1 -->
    <button class="btn-func" data-action="clear">AC</button>
    <button class="btn-func" data-action="sign">+/−</button>
    <button class="btn-func" data-action="percent">%</button>
    <button class="btn-op"   data-action="op" data-value="÷">÷</button>
    <!-- Row 2 -->
    <button class="btn-num"  data-action="num" data-value="7">7</button>
    <button class="btn-num"  data-action="num" data-value="8">8</button>
    <button class="btn-num"  data-action="num" data-value="9">9</button>
    <button class="btn-op"   data-action="op" data-value="×">×</button>
    <!-- Row 3 -->
    <button class="btn-num"  data-action="num" data-value="4">4</button>
    <button class="btn-num"  data-action="num" data-value="5">5</button>
    <button class="btn-num"  data-action="num" data-value="6">6</button>
    <button class="btn-op"   data-action="op" data-value="−">−</button>
    <!-- Row 4 -->
    <button class="btn-num"  data-action="num" data-value="1">1</button>
    <button class="btn-num"  data-action="num" data-value="2">2</button>
    <button class="btn-num"  data-action="num" data-value="3">3</button>
    <button class="btn-op"   data-action="op" data-value="+">+</button>
    <!-- Row 5 -->
    <button class="btn-num btn-zero" data-action="num" data-value="0">0</button>
    <button class="btn-num"  data-action="decimal">.</button>
    <button class="btn-eq"   data-action="equals">=</button>
  </div>
</div>

<script>
  const expressionEl = document.getElementById('expression');
  const resultEl     = document.getElementById('result');

  const state = {
    current:   '0',   // number being typed
    previous:  null,  // stored left-hand operand
    operator:  null,  // pending operator
    justCalc:  false, // true right after = was pressed
  };

  const OPS = { '÷': (a, b) => a / b, '×': (a, b) => a * b, '−': (a, b) => a - b, '+': (a, b) => a + b };

  function fmt(n) {
    const s = parseFloat(n.toPrecision(12)).toString();
    return s.length > 16 ? n.toExponential(6) : s;
  }

  function updateDisplay() {
    const val = parseFloat(state.current);
    const text = isNaN(val) ? 'Error' : fmt(val);
    resultEl.textContent = text;
    resultEl.className = 'result' + (text.length > 12 ? ' xsmall' : text.length > 8 ? ' small' : '');

    // expression line
    if (state.operator && state.previous !== null) {
      expressionEl.textContent = `${fmt(state.previous)} ${state.operator}`;
    } else {
      expressionEl.textContent = '';
    }

    // highlight active operator button
    document.querySelectorAll('.btn-op').forEach(btn => {
      btn.classList.toggle('active', state.operator && btn.dataset.value === state.operator && state.justCalc === false && state.previous !== null);
    });
  }

  function calculate(a, op, b) {
    const result = OPS[op](a, b);
    if (!isFinite(result)) return NaN;
    return result;
  }

  function handleAction(action, value) {
    switch (action) {
      case 'num': {
        if (state.justCalc) { state.current = value; state.justCalc = false; break; }
        state.current = state.current === '0' ? value : state.current + value;
        break;
      }
      case 'decimal': {
        if (state.justCalc) { state.current = '0.'; state.justCalc = false; break; }
        if (!state.current.includes('.')) state.current += '.';
        break;
      }
      case 'op': {
        const cur = parseFloat(state.current);
        if (state.operator && !state.justCalc) {
          // chain: evaluate pending operation first
          const res = calculate(state.previous, state.operator, cur);
          state.previous = isNaN(res) ? cur : res;
          state.current  = String(state.previous);
        } else {
          state.previous = cur;
        }
        state.operator = value;
        state.justCalc = false;
        // next digit press will replace current
        state.justCalc = true;
        break;
      }
      case 'equals': {
        if (state.operator === null || state.previous === null) break;
        const a = state.previous;
        const b = parseFloat(state.current);
        const res = calculate(a, state.operator, b);
        expressionEl.textContent = `${fmt(a)} ${state.operator} ${fmt(b)} =`;
        state.current  = isNaN(res) ? 'Error' : String(fmt(res));
        state.previous = null;
        state.operator = null;
        state.justCalc = true;
        break;
      }
      case 'clear': {
        state.current  = '0';
        state.previous = null;
        state.operator = null;
        state.justCalc = false;
        expressionEl.textContent = '';
        break;
      }
      case 'sign': {
        const v = parseFloat(state.current);
        if (!isNaN(v)) state.current = String(-v);
        break;
      }
      case 'percent': {
        const v = parseFloat(state.current);
        if (!isNaN(v)) state.current = String(v / 100);
        break;
      }
    }
    updateDisplay();
  }

  // Robot sprite
  const ROBOT_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 48" width="40" height="48">
    <rect x="19" y="1" width="2" height="6" rx="1" fill="#888"/>
    <circle cx="20" cy="1" r="3" fill="#ff9500"/>
    <rect x="5" y="7" width="30" height="21" rx="6" fill="#3c3c3c" stroke="#606060" stroke-width="1"/>
    <circle cx="14" cy="17" r="5" fill="#111"/>
    <circle cx="14" cy="17" r="2.5" fill="#00d4ff"/>
    <circle cx="15.5" cy="15.5" r="1" fill="white" opacity="0.5"/>
    <circle cx="26" cy="17" r="5" fill="#111"/>
    <circle cx="26" cy="17" r="2.5" fill="#00d4ff"/>
    <circle cx="27.5" cy="15.5" r="1" fill="white" opacity="0.5"/>
    <path d="M14 24 Q20 28 26 24" stroke="#777" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <rect x="16" y="28" width="8" height="4" rx="2" fill="#333"/>
    <rect x="7" y="32" width="26" height="14" rx="5" fill="#2a2a2a" stroke="#505050" stroke-width="1"/>
    <rect x="14" y="36" width="12" height="6" rx="2" fill="#1e1e1e" stroke="#404040" stroke-width="1"/>
    <circle cx="17" cy="39" r="2" fill="#ff9500"/>
    <circle cx="23" cy="39" r="2" fill="#00d4ff"/>
  </svg>`;

  function spawnRobot(btn) {
    const rect = btn.getBoundingClientRect();
    const W = 40, H = 48;
    const el = document.createElement('div');
    el.className = 'robot-sprite';
    el.innerHTML = ROBOT_SVG;
    el.style.left = (rect.left + rect.width / 2 - W / 2) + 'px';
    el.style.top  = (rect.top - H + 5) + 'px';
    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }

  function getButtonForKey(key) {
    if (/^[0-9]$/.test(key))        return document.querySelector(`button[data-action="num"][data-value="${key}"]`);
    if (key === '/')                 return document.querySelector('button[data-value="÷"]');
    if (key === '*')                 return document.querySelector('button[data-value="×"]');
    if (key === '-')                 return document.querySelector('button[data-value="−"]');
    if (key === '+')                 return document.querySelector('button[data-value="+"]');
    if (key === 'Enter' || key === '=') return document.querySelector('button[data-action="equals"]');
    if (key === 'Escape')            return document.querySelector('button[data-action="clear"]');
    if (key === '.')                 return document.querySelector('button[data-action="decimal"]');
    if (key === '%')                 return document.querySelector('button[data-action="percent"]');
    return null;
  }

  // Button clicks
  document.querySelector('.buttons').addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    spawnRobot(btn);
    handleAction(btn.dataset.action, btn.dataset.value);
  });

  // Keyboard support
  const KEY_MAP = {
    '0':'num','1':'num','2':'num','3':'num','4':'num',
    '5':'num','6':'num','7':'num','8':'num','9':'num',
    '/':'op','*':'op','-':'op','+':'op',
    'Enter':'equals','=':'equals',
    'Backspace':'backspace','Escape':'clear',
    '.':'decimal','%':'percent',
  };
  const KEY_OP = { '/':'÷', '*':'×', '-':'−', '+':'+' };

  document.addEventListener('keydown', e => {
    const action = KEY_MAP[e.key];
    if (!action) return;
    e.preventDefault();
    const btn = getButtonForKey(e.key);
    if (btn) {
      spawnRobot(btn);
      btn.classList.add('kb-active');
      setTimeout(() => btn.classList.remove('kb-active'), 150);
    }
    if (action === 'backspace') {
      if (state.justCalc) return;
      state.current = state.current.length > 1 ? state.current.slice(0, -1) : '0';
      updateDisplay();
    } else {
      const val = action === 'op' ? KEY_OP[e.key] : e.key;
      handleAction(action, val);
    }
  });

  updateDisplay();
</script>
</body>
</html>
